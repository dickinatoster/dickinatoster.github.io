<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王怡文｜7. 設計GAS程式｜選擇題測驗</title>
  <style>
    :root {
      --bg-1: #eef9ff;
      --bg-2: #dcefff;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-strong: rgba(244, 250, 255, 0.98);
      --border: rgba(86, 150, 200, 0.18);
      --text: #183245;
      --muted: #5d7c91;
      --primary: #4fa7df;
      --primary-dark: #2a7fb9;
      --success: #2e9f71;
      --danger: #e16a78;
      --shadow: 0 24px 70px rgba(53, 112, 152, 0.14);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.92), transparent 34%),
        radial-gradient(circle at 90% 20%, rgba(255,255,255,0.82), transparent 28%),
        radial-gradient(circle at 20% 85%, rgba(255,255,255,0.42), transparent 25%),
        linear-gradient(145deg, var(--bg-1) 0%, #e4f4ff 42%, var(--bg-2) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      opacity: 0.55;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.34));
      animation: float 12s ease-in-out infinite;
    }

    .blob.one { width: 220px; height: 220px; top: -40px; left: -30px; }
    .blob.two { width: 280px; height: 280px; top: 8%; right: -80px; animation-delay: -3s; }
    .blob.three { width: 190px; height: 190px; bottom: 6%; left: 9%; animation-delay: -6s; }
    .blob.four { width: 150px; height: 150px; bottom: 12%; right: 12%; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-14px) translateX(8px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      animation: appear 600ms ease both;
    }

    .hero {
      padding: 26px 28px 22px;
      background: linear-gradient(135deg, rgba(79,167,223,0.96), rgba(123,196,236,0.92));
      color: #fff;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #dff8ff;
      box-shadow: 0 0 0 0 rgba(223,248,255,0.6);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(223,248,255,0.55); }
      70% { box-shadow: 0 0 0 12px rgba(223,248,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(223,248,255,0); }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3.4vw, 2.8rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .hero p {
      margin: 8px 0 0;
      max-width: 60ch;
      line-height: 1.7;
      color: rgba(255,255,255,0.93);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
    }

    .stat .label {
      display: block;
      font-size: 12px;
      opacity: 0.88;
      margin-bottom: 4px;
      letter-spacing: 0.06em;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 800;
    }

    .content {
      padding: 24px 28px 28px;
      background: var(--panel-strong);
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .progress-track {
      flex: 1;
      min-width: 220px;
      height: 14px;
      border-radius: 999px;
      background: #d9edf8;
      overflow: hidden;
      border: 1px solid rgba(79,167,223,0.18);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), #7cc8ec);
      transition: width 220ms ease;
    }

    .progress-text {
      font-weight: 700;
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .quiz-card {
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 12px 30px rgba(53, 112, 152, 0.08);
      padding: 24px;
    }

    .quiz-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .quiz-head h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2.6vw, 1.6rem);
      line-height: 1.4;
    }

    .question-tag {
      padding: 8px 12px;
      border-radius: 999px;
      background: #ebf8ff;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 18px;
      border: 1px solid rgba(79,167,223,0.18);
      background: #f7fcff;
      cursor: pointer;
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .option:hover,
    .option:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(79,167,223,0.48);
      box-shadow: 0 10px 18px rgba(79, 167, 223, 0.12);
      outline: none;
    }

    .option.selected {
      border-color: var(--primary);
      background: #e8f6ff;
    }

    .option.correct {
      border-color: rgba(46,159,113,0.52);
      background: #eefbf6;
    }

    .option.wrong {
      border-color: rgba(225,106,120,0.52);
      background: #fff0f2;
    }

    .option .marker {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      flex: none;
      font-weight: 800;
      color: var(--primary-dark);
      background: #dff1ff;
    }

    .option .text {
      line-height: 1.7;
      color: var(--text);
      font-weight: 600;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .hint {
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      outline: none;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 12px 24px rgba(42,127,185,0.22);
    }

    .btn.ghost {
      background: #ecf7ff;
      color: var(--primary-dark);
      border: 1px solid rgba(79,167,223,0.22);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }

    .result {
      display: none;
      margin-top: 16px;
      padding: 22px;
      border-radius: 22px;
      background: linear-gradient(180deg, #f7fcff, #ecf8ff);
      border: 1px solid rgba(79,167,223,0.18);
    }

    .result.show {
      display: block;
      animation: appear 420ms ease both;
    }

    .result h3 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    .result .score {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      color: var(--primary-dark);
      margin: 6px 0;
    }

    .result .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .review {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .review-item {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(79,167,223,0.14);
    }

    .review-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .review-item .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .pill.ok { background: #e9fbf4; color: var(--success); }
    .pill.bad { background: #ffeef1; color: var(--danger); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .hero,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .quiz-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
    <div class="blob four"></div>
  </div>

  <main class="app">
    <section class="hero">
      <div class="hero-top">
        <div class="brand">
          <div class="badge">設計者 王怡文</div>
          <h1>7. 設計GAS程式｜選擇題測驗</h1>
          <p>淡藍色主題的選擇題測驗頁，總分 <span id="totalScoreInline">100</span> 分。完成後會立即顯示分數與答題結果。</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">目前題號</span>
          <span class="value" id="currentQuestionStat">1 / 10</span>
        </div>
        <div class="stat">
          <span class="label">目前分數</span>
          <span class="value" id="currentScoreStat">0</span>
        </div>
        <div class="stat">
          <span class="label">單字來源</span>
          <span class="value" id="wordSourceStat">200 個單字</span>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="progress-wrap">
        <div class="progress-track" aria-label="測驗進度">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">第 1 題 / 10 題</div>
      </div>

      <div class="quiz-card" id="quizCard">
        <div class="quiz-head">
          <h2 id="questionText"></h2>
          <div class="question-tag" id="questionTag">題目 1</div>
        </div>

        <div class="options" id="options"></div>

        <div class="footer">
          <div class="hint" id="hintText">請先選擇一個答案，再按下一題。</div>
          <div class="actions">
            <button class="btn ghost" id="prevBtn" type="button">上一題</button>
            <button class="btn primary" id="nextBtn" type="button">下一題</button>
            <button class="btn primary" id="submitBtn" type="button" style="display:none;">交卷看成績</button>
          </div>
        </div>
      </div>

      <div class="result" id="resultPanel" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const quizData = <?!= quizDataJson ?>;
    const quizSourceCount = <?!= quizSourceCount ?>;
    const totalScore = quizData.reduce((sum, item) => sum + (Number(item.points) || 10), 0);
    const state = {
      currentIndex: 0,
      answers: Array(quizData.length).fill(null),
      submitted: false
    };

    const questionText = document.getElementById('questionText');
    const questionTag = document.getElementById('questionTag');
    const options = document.getElementById('options');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const hintText = document.getElementById('hintText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const resultPanel = document.getElementById('resultPanel');
    const currentQuestionStat = document.getElementById('currentQuestionStat');
    const currentScoreStat = document.getElementById('currentScoreStat');
    const wordSourceStat = document.getElementById('wordSourceStat');
    const totalScoreInline = document.getElementById('totalScoreInline');

    currentQuestionStat.textContent = `1 / ${quizData.length}`;
    currentScoreStat.textContent = `0`;
    wordSourceStat.textContent = `${quizSourceCount} 個單字`;
    totalScoreInline.textContent = totalScore;
    progressText.textContent = `第 1 題 / ${quizData.length} 題`;

    function renderQuestion() {
      const currentQuestion = quizData[state.currentIndex];
      const savedAnswer = state.answers[state.currentIndex];

      questionText.textContent = currentQuestion.question;
      questionTag.textContent = `題目 ${state.currentIndex + 1}`;
      progressText.textContent = `第 ${state.currentIndex + 1} 題 / ${quizData.length} 題`;
      currentQuestionStat.textContent = `${state.currentIndex + 1} / ${quizData.length}`;
      progressBar.style.width = `${((state.currentIndex + 1) / quizData.length) * 100}%`;
      options.innerHTML = '';

      currentQuestion.options.forEach((option, optionIndex) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        if (savedAnswer === optionIndex) {
          button.classList.add('selected');
        }
        button.innerHTML = `<span class="marker">${String.fromCharCode(65 + optionIndex)}</span><span class="text">${option}</span>`;
        button.addEventListener('click', () => {
          if (state.submitted) {
            return;
          }
          state.answers[state.currentIndex] = optionIndex;
          renderQuestion();
        });
        options.appendChild(button);
      });

      prevBtn.disabled = state.currentIndex === 0;
      nextBtn.style.display = state.currentIndex === quizData.length - 1 ? 'none' : 'inline-flex';
      submitBtn.style.display = state.currentIndex === quizData.length - 1 ? 'inline-flex' : 'none';

      const hasAnswer = state.answers[state.currentIndex] !== null;
      hintText.textContent = hasAnswer ? '這題已選擇答案，可以繼續往下一題。' : '請先選擇一個答案，再按下一題。';
    }

    function goToQuestion(index) {
      state.currentIndex = Math.max(0, Math.min(index, quizData.length - 1));
      renderQuestion();
    }

    function calculateScore() {
      let correctCount = 0;
      let score = 0;
      const review = [];

      quizData.forEach((item, index) => {
        const answerIndex = state.answers[index];
        const isCorrect = answerIndex === item.answer;
        if (isCorrect) {
          correctCount += 1;
          score += Number(item.points) || 0.5;
        }

        review.push({
          question: item.question,
          picked: answerIndex === null ? '未作答' : item.options[answerIndex],
          correct: item.options[item.answer],
          isCorrect: isCorrect
        });
      });

      const rounded = Number(score.toFixed(1));
      return {
        score: rounded,
        correctCount,
        review
      };
    }

    function submitQuiz() {
      state.submitted = true;
      const result = calculateScore();
      progressBar.style.width = '100%';
      progressText.textContent = '測驗完成';
      hintText.textContent = '已交卷，下面是成績與答題檢視。';

      const passed = result.score >= 60;
      resultPanel.classList.add('show');
      resultPanel.innerHTML = `
        <h3>${passed ? '完成測驗' : '再接再厲'}</h3>
        <div class="score">${result.score} / ${totalScore}</div>
        <p class="note">答對 ${result.correctCount} 題，共 ${quizData.length} 題。總分 ${totalScore} 分。</p>
        <div class="review">
          ${result.review.map((item, index) => `
            <div class="review-item">
              <strong>${index + 1}. ${item.question}</strong>
              <div class="meta">
                <span class="pill ${item.isCorrect ? 'ok' : 'bad'}">${item.isCorrect ? '答對' : '答錯'}</span>
                <span>你的答案：${item.picked}</span>
                <span>正確答案：${item.correct}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      // 更新目前分數顯示
      currentScoreStat.textContent = result.score;

      options.querySelectorAll('.option').forEach((button, optionIndex) => {
        button.disabled = true;
        const currentQuestion = quizData[state.currentIndex];
        if (optionIndex === currentQuestion.answer) {
          button.classList.add('correct');
        }
        if (state.answers[state.currentIndex] === optionIndex && optionIndex !== currentQuestion.answer) {
          button.classList.add('wrong');
        }
      });

      prevBtn.disabled = true;
      nextBtn.disabled = true;
      submitBtn.disabled = true;
    }

    prevBtn.addEventListener('click', () => {
      if (state.currentIndex > 0) {
        goToQuestion(state.currentIndex - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (state.currentIndex < quizData.length - 1) {
        goToQuestion(state.currentIndex + 1);
      }
    });

    submitBtn.addEventListener('click', submitQuiz);

    renderQuestion();
  </script>
</body>
</html>
